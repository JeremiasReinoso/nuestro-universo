<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Para vos</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;1,400&family=Inter:wght@400;500;600&family=Dancing+Script:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="icon" href="assets/icons/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="css/story.css" />
</head>
<body>
  <div id="intro">
    <svg class="intro-heart" viewBox="0 0 100 90" aria-hidden="true">
      <path class="heart-path" d="M50 82 C50 82 8 54 8 28 C8 15 18 7 29 7 C37 7 44 11 50 18 C56 11 63 7 71 7 C82 7 92 15 92 28 C92 54 50 82 50 82 Z"/>
    </svg>
    <p class="intro-message">Cada latido me recuerda a vos.</p>
    <button id="enter-btn" class="enter-btn">Entrar</button>
  </div>

  <div class="chapters">
    <div class="chapter" id="chapter1">
      <h1 class="welcome-title">Cada latido me recuerda a vos.</h1>
    </div>

    <div class="chapter" id="chapter2">
      <div class="letter">
        <p class="greeting">Querida,</p>
        <p class="letter-body"></p>
        <p class="closing">Con todo mi amor</p>
        <p class="signature">[Mi nombre]</p>
      </div>
    </div>

    <div class="chapter" id="chapter3">
      <div class="photo-frame">
        <img id="photo1" class="photo" alt="Foto 1" />
        <div class="photo-caption">
          <p id="caption1" class="caption-quote"></p>
          <p id="quote1" class="photo-quote"></p>
        </div>
      </div>
    </div>

    <div class="chapter" id="chapter4">
      <div class="letter-alt">
        <p class="letter-alt-text"></p>
      </div>
    </div>

    <div class="chapter" id="chapter5">
      <div class="song">
        <svg class="music-note" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M12 4v17.5c0 .8.4 1.5 1 2.5H9c-1.1 0-2-.9-2-2V12H3V4h9M18 4v4l-3 .5 3 .5V4z"/>
        </svg>
        <div class="song-info">
          <p class="song-quote">Cada vez que la escucho pienso en vos.</p>
          <p class="song-title"></p>
          <p class="song-artist"></p>
        </div>
        <button id="play-btn" class="play-btn">Reproducir</button>
        <audio id="music-player" preload="metadata"></audio>
      </div>
    </div>

    <div class="chapter" id="chapter6">
      <div class="photo-frame">
        <img id="photo2" class="photo" alt="Foto 2" />
        <div class="photo-caption">
          <p id="caption2" class="caption-quote"></p>
          <p id="quote2" class="photo-quote"></p>
        </div>
      </div>
    </div>

    <div class="chapter" id="chapter7">
      <div class="small-things">
        <p class="section-title">Las pequeñas cosas</p>
        <div class="items-container">
          <p class="item" id="item1"></p>
        </div>
      </div>
    </div>

    <div class="chapter" id="chapter8">
      <div class="dreams">
        <p class="section-title">Nuestros sueños</p>
        <div class="dreams-container">
          <p class="dream-item" id="dream1"></p>
        </div>
      </div>
    </div>

    <div class="chapter" id="chapter9">
      <div class="miss-container">
        <p class="section-title">Cuando me extrañes</p>
        <button id="btn-miss" class="btn-miss">Leer mensaje</button>
        <div id="miss-card" class="miss-card hidden">
          <p id="miss-text" class="miss-text"></p>
        </div>
      </div>
    </div>

    <div class="chapter" id="chapter10">
      <div class="final">
        <svg class="final-heart" viewBox="0 0 100 90" aria-hidden="true">
          <path class="final-heart-path" d="M50 85 C50 85 5 55 5 28 C5 14 16 5 28 5 C36 5 44 9 50 16 C56 9 64 5 72 5 C84 5 95 14 95 28 C95 55 50 85 50 85 Z"/>
        </svg>
        <p class="final-quote">La mejor parte de nuestra historia<br>todavía está por escribirse.</p>
        <p class="final-page">Página 1 de ∞</p>
      </div>
    </div>
  </div>

  <!-- Reproductor flotante -->
  <div id="floating-player">
    <svg class="player-icon" viewBox="0 0 24 24" aria-hidden="true">
      <path d="M12 4v17.5c0 .8.4 1.5 1 2.5H9c-1.1 0-2-.9-2-2V12H3V4h9M18 4v4l-3 .5 3 .5V4z"/>
    </svg>
    <span class="player-time" id="player-time">--:-- / --:--</span>
  </div>

  <script src="js/story.js"></script>
</body>
</html>
